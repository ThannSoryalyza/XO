services:
  - type: web
    name: xounited
    runtime: php
    branch: main
    buildCommand: composer install --optimize-autoloader --no-dev && php artisan migrate --force && php artisan storage:link
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr
